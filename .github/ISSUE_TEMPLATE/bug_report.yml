name: Bug 报告
description: 报告可以稳定复现的功能异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 苦力怕菜单版本
      placeholder: 例如 v3.0.1
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft 精确版本
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options: [本地世界, Realms, BDS]
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: 构建变体
      options: [普通兼容版, BDS 增强版]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请从干净启动开始列出完整步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: 其他 Addon、日志与截图
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认不是重复问题
          required: true
        - label: 该问题不包含需要私下报告的安全漏洞
          required: true